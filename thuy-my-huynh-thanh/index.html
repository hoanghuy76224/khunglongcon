<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thúy My &amp; Huỳnh Thanh · Lụa đỏ</title>
<style>html,body{margin:0;background:#121010;color:white;font:16px system-ui}main{min-height:100svh;display:grid;align-content:center;justify-items:center;gap:1rem}video{display:block;width:min(100%,1200px);max-height:85svh}h1{margin:.5rem 1rem;font-size:clamp(1rem,3vw,1.4rem);font-weight:500;text-align:center}</style>
<main><video controls playsinline preload="metadata" aria-label="Lụa đỏ – Điệp khúc"></video><h1>Thúy My &amp; Huỳnh Thanh · Lụa đỏ – Điệp khúc</h1></main>
<script src="hls.light.min.js"></script><script>
const video = document.querySelector('video');
if (video.canPlayType('application/vnd.apple.mpegurl')) {
  video.src = 'clip.m3u8';
} else if (window.Hls && Hls.isSupported()) {
  const player = new Hls();
  player.loadSource('clip.m3u8');
  player.attachMedia(video);
} else {
  document.querySelector('main').insertAdjacentHTML('beforeend','<p>Vui lòng mở bằng Safari, Chrome hoặc Edge để xem video.</p>');
}
</script></html>
